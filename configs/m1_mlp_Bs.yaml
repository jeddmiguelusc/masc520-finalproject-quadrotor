# M1 on Split B_s (speed extrapolation): train/val on samples with |v| <= 5 m/s, test = Split A test.
# H1 compares M2_Bs vs M1_Bs on the > 5 m/s part of the test set. Same hyperparameters as m1_mlp.yaml.
name: m1_mlp_Bs
model: {type: mlp, prior: false, hidden: [128, 128, 64], nll: false}
data: {source: neurobem, split: B_s, max_window: 20}
train: {batch_size: 1024, lr: 1.0e-3, max_epochs: 100, patience: 8, max_hours: 8}
