# M3: hybrid = P0b prior + causal TCN residual over 20 samples (50 ms). H2 compares M3 vs M2.
# Ensemble: same config, seeds 0,1,2, with model.nll=true (see configs/m3_ensemble_member.yaml).
name: m3_hybrid_tcn
model: {type: tcn, prior: true, window: 20, channels: 40, kernel: 3, dilations: [1, 2, 4, 8], head_hidden: 64, nll: false}
data: {source: neurobem, split: A, max_window: 20}
train: {batch_size: 1024, lr: 1.0e-3, max_epochs: 100, patience: 8, max_hours: 8}
